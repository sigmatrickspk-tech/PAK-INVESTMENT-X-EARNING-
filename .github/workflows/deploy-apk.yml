name: Deploy Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Increment Version Code & Name
        run: npm run bump-version

      - name: Build Web App with Vite
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAK-INVESTMENT-X-EARNING-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
